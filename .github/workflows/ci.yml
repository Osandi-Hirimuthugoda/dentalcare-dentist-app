# DentalCare+ CI/CD Pipeline
# Automatically tests and builds on every push to main branch
# Tests: Backend unit+integration, Frontend unit, Flutter unit+widget, Docker builds

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '22'

jobs:
  backend-tests:
    name: Backend Tests (Unit + Integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install MongoDB
        run: |
          wget -qO - https://www.mongodb.org/static/pgp/server-8.0.asc | sudo apt-key add -
          echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update -qq
          sudo apt-get install -y mongodb-org-server
          mongod --version

      - name: Install dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Run tests
        working-directory: backend
        run: node --experimental-vm-modules --no-warnings node_modules/jest/bin/jest.js --runInBand --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: dentalcare_secret_key_change_in_production
          MONGOMS_SYSTEM_BINARY: /usr/bin/mongod
          MONGOMS_DISABLE_POSTINSTALL: '1'

  frontend-tests:
    name: Frontend Tests (Unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run tests
        working-directory: frontend
        run: npm test -- --watchAll=false --verbose
        env:
          CI: 'true'

  mobile-tests:
    name: Mobile Tests (Unit + Widget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run tests
        working-directory: mobile
        run: flutter test --reporter expanded

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: dentalcare-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: dentalcare-frontend:ci
          build-args: REACT_APP_API_URL=http://localhost:4000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI model image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/models
          push: false
          tags: dentalcare-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, mobile-tests, docker]
    if: always()
    steps:
      - name: Report results
        run: |
          echo "=========================================="
          echo "  DentalCare+ CI/CD Pipeline Results"
          echo "=========================================="
          echo "  Backend Tests  : ${{ needs.backend-tests.result }}"
          echo "  Frontend Tests : ${{ needs.frontend-tests.result }}"
          echo "  Mobile Tests   : ${{ needs.mobile-tests.result }}"
          echo "  Docker Build   : ${{ needs.docker.result }}"
          echo "=========================================="
