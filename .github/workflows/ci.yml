# DentalCare+ CI Pipeline
# Runs on push and pull_request to main/master; builds backend, frontend, and Docker images.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Verify server starts
        working-directory: backend
        run: |
          timeout 5 node server.js || true
        env:
          MONGO_URI: mongodb://localhost:27017/dentalcare
          JWT_SECRET: ci-secret
          PORT: 4000
          ALLOW_DB_FAILURE: 'true'

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          CI: 'true'
          REACT_APP_API_URL: http://localhost:4000

      - name: Test
        working-directory: frontend
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: 'true'

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: dentalcare-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: dentalcare-frontend:ci
          build-args: REACT_APP_API_URL=http://localhost:4000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI model image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/models
          push: false
          tags: dentalcare-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
