# DentalCare+ — Docker Compose
# Run: docker-compose up -d
# Backend: http://localhost:4000  |  Frontend: http://localhost:3000

services:
  mongodb:
    image: mongo:7
    container_name: dentalcare-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: dentalcare
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  ai-model:
    build:
      context: ./backend/models
      dockerfile: Dockerfile
    container_name: dentalcare-ai-model
    restart: unless-stopped
    ports:
      - "5000:5000"
    # Uncomment and put model_weights.pth in backend/models/ for real AI predictions:
    # volumes:
    #   - ./backend/models/model_weights.pth:/app/model_weights.pth:ro
    # Optional: use GPU (uncomment if host has nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dentalcare-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongodb:27017/dentalcare
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      FLASK_API_URL: http://ai-model:5000
      EMAIL_USER: osandihirimuthugodage23.se@gmail.com
      EMAIL_PASS: tcvc yyle ylxx orhg
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
      ai-model:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    container_name: dentalcare-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Selenium standalone Chrome for automated testing
  selenium:
    image: selenium/standalone-chrome:latest
    container_name: dentalcare-selenium
    shm_size: "2gb"
    ports:
      - "4444:4444"
      - "7900:7900"   # VNC viewer: http://localhost:7900 (password: secret)
    environment:
      SE_NODE_MAX_SESSIONS: 3
      SE_VNC_NO_PASSWORD: 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    profiles:
      - testing

  # Test runner - runs Selenium tests against the live app
  tests:
    build:
      context: ./tests
      dockerfile: Dockerfile
    container_name: dentalcare-tests
    environment:
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
      FRONTEND_URL: http://frontend:80
      DOCTOR_EMAIL: ${DOCTOR_EMAIL:-doctor@test.com}
      DOCTOR_PASSWORD: ${DOCTOR_PASSWORD:-password123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@dentalcare.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - ./tests/reports:/tests/reports
    depends_on:
      selenium:
        condition: service_healthy
      frontend:
        condition: service_started
      backend:
        condition: service_started
    profiles:
      - testing

volumes:
  mongodb_data:
  backend_uploads:
