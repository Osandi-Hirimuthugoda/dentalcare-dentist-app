# DentalCare+ — Docker Compose
# Run: docker-compose up -d
# Backend: http://localhost:4000  |  Frontend: http://localhost:3000

services:
  mongodb:
    image: mongo:7
    container_name: dentalcare-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: dentalcare
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  ai-model:
    build:
      context: ./backend/models
      dockerfile: Dockerfile
    container_name: dentalcare-ai-model
    restart: unless-stopped
    ports:
      - "5000:5000"
    # Uncomment and put model_weights.pth in backend/models/ for real AI predictions:
    # volumes:
    #   - ./backend/models/model_weights.pth:/app/model_weights.pth:ro
    # Optional: use GPU (uncomment if host has nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dentalcare-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongodb:27017/dentalcare
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      FLASK_API_URL: http://ai-model:5000
    depends_on:
      mongodb:
        condition: service_healthy
      ai-model:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:4000
    container_name: dentalcare-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
  backend_uploads:
